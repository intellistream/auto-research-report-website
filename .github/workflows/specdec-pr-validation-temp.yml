name: SpecDec Final PR Gate (temporary)
on:
  push:
    branches:
      - feat/specdec-living-synthesis-20261118
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Python research and daily-ingestion contracts
        run: python3 -m unittest discover -s scripts
      - name: npm install
        run: npm ci
      - name: Frontend component regression
        run: npm test
      - name: TypeScript and production subpath build
        run: npm run build
      - name: Browser smoke prerequisites
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          command -v google-chrome
      - name: Validate SpecDec reading surface and ACL regression
        run: |
          (npm run preview -- --host 127.0.0.1 --port 5173 >/tmp/specdec-preview.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          node .github/specdec-pr-smoke.mjs
