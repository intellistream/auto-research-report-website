name: SpecDec figure preview

on:
  push:
    branches:
      - review/specdec-figures-20261119
    paths:
      - .github/workflows/specdec-figures-preview.yml
      - topics/speculative-decoding/paper/paper.md
      - topics/speculative-decoding/paper/figures/*.tex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specdec-figure-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-verify-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile editable figures, manuscript PDF and self-contained HTML
        uses: xu-cheng/texlive-action@v3
        with:
          os: debian
          texlive_version: 2025
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends pandoc poppler-utils fonts-noto-cjk
            bash topics/speculative-decoding/paper/build.sh
      - name: Check figure positions, semantics and non-clickable mentions
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends poppler-utils
          python3 - <<'PY'
          from pathlib import Path
          root = Path('topics/speculative-decoding/paper')
          md = (root/'paper.md').read_text(encoding='utf-8')
          html = (root/'paper.html').read_text(encoding='utf-8')
          assert md.count('](figures/') == 2
          assert 'figures/execution-shape.png' in md
          assert 'figures/state-commit' not in md
          assert '[图 1]' not in md and '[图 2]' not in md
          assert 'href="#fig-round"' not in html and 'href="#fig-execution"' not in html
          assert html.count('<figure id="fig-') == 2
          assert html.count('data:image/png;base64,') >= 2
          assert html.index('id="fig-round"') < html.index('id="fig-execution"')
          assert html.index('id="fig-execution"') < html.index('id="fidelity"')
          assert (root/'figures/execution-shape.pdf').stat().st_size > 10000
          assert (root/'figures/specdec-round.pdf').stat().st_size > 10000
          print('PASS: non-clickable figure mentions, valid figure order, embedded pictures')
          PY
          pdfinfo topics/speculative-decoding/paper/paper.pdf | grep -E 'Pages:|Page size:'
          pdftotext topics/speculative-decoding/paper/paper.pdf /tmp/specdec-figures-text.txt
          grep -q '参考文献' /tmp/specdec-figures-text.txt
      - name: Publish new frozen paper version for local npm dev preview
        run: python3 scripts/publish-specdec-paper.py --publish
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate topic contracts and frontend build
        run: |
          python3 -m unittest discover -s scripts
          npm ci
          npm test
          npm run build
      - name: Attach rendered figure previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specdec-figures-preview
          path: |
            topics/speculative-decoding/paper/figures/*.png
            topics/speculative-decoding/paper/paper.pdf
          retention-days: 14
      - name: Commit only versioned preview assets to review branch
        run: |
          git add -- \
            topics/speculative-decoding/paper/paper.tex \
            topics/speculative-decoding/paper/paper.html \
            topics/speculative-decoding/paper/paper.pdf \
            topics/speculative-decoding/paper/figures \
            topics/speculative-decoding/survey.json \
            public/word-reports/topics.json \
            public/word-reports/topic-papers/speculative-decoding
          if git diff --cached --quiet; then
            echo 'No publication changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build reviewed SpecDec academic figure preview'
          git push origin HEAD:refs/heads/review/specdec-figures-20261119
