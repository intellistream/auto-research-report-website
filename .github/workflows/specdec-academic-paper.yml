name: SpecDec academic paper

on:
  push:
    branches:
      - research/specdec-academic-survey-20261118
    paths:
      - .github/workflows/specdec-academic-paper.yml
      - topics/speculative-decoding/paper/paper.md
      - topics/speculative-decoding/paper/references.bib
      - topics/speculative-decoding/paper/paper-header.tex
      - topics/speculative-decoding/paper/paper.css
      - topics/speculative-decoding/paper/build.sh
      - topics/speculative-decoding/paper/figures/*.tex
      - scripts/publish-specdec-paper.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: specdec-academic-paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-publish-validate:
    if: github.ref == 'refs/heads/research/specdec-academic-survey-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Pandoc, XeLaTeX, CJK fonts and PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            pandoc texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended lmodern fonts-noto-cjk poppler-utils
          pandoc --version | head -1
          xelatex --version | head -1

      - name: Build all manuscript formats from the same Markdown and bibliography
        run: bash topics/speculative-decoding/paper/build.sh

      - name: Check PDF pages, figures and rendered bibliography
        run: |
          pdfinfo topics/speculative-decoding/paper/paper.pdf
          pdftotext -layout topics/speculative-decoding/paper/paper.pdf /tmp/specdec-text.txt
          python3 - <<'PY'
          from pathlib import Path
          body = Path('/tmp/specdec-text.txt').read_text()
          for phrase in ('引言', '正确性', '目标验证', '实验证据', '参考文献'):
              if phrase not in body:
                  raise SystemExit(f'PDF text lacks manuscript section: {phrase}')
          pdf = Path('topics/speculative-decoding/paper/paper.pdf').read_bytes()
          assert pdf.startswith(b'%PDF-') and len(pdf) > 25000
          print(f'Validated text PDF, {len(pdf)} bytes')
          PY
          pdftoppm -f 1 -l 1 -scale-to 1600 -png -singlefile \
            topics/speculative-decoding/paper/paper.pdf /tmp/specdec-cover
          test -s /tmp/specdec-cover.png

      - name: Freeze verified paper, publish versioned assets and bind survey index
        run: python3 scripts/publish-specdec-paper.py --publish

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Validate site, academic importer and generated academic paper
        run: |
          python3 -m unittest discover -s scripts
          npm ci
          npm test
          npm run build
          node -e 'const fs=require("fs"); const t=JSON.parse(fs.readFileSync("public/word-reports/topics.json")); const p=t.topics.find(x=>x.id==="speculative-decoding").academicPaper; if(!p)process.exit(1); for(const v of ["html","pdf","markdown","latex","bibtex","sources"]) if(!fs.existsSync("public/word-reports/"+p.assets[v].path)) process.exit(2); console.log("SpecDec live academic paper:",p.version)'

      - name: Upload inspection artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specdec-paper-inspection
          path: |
            /tmp/specdec-cover.png
            topics/speculative-decoding/paper/paper.pdf
          retention-days: 14

      - name: Commit verified generated assets to the editorial branch
        run: |
          git add -- \
            topics/speculative-decoding/paper/paper.tex \
            topics/speculative-decoding/paper/paper.html \
            topics/speculative-decoding/paper/paper.pdf \
            topics/speculative-decoding/paper/figures \
            topics/speculative-decoding/survey.json \
            public/word-reports/topics.json \
            public/word-reports/topic-papers/speculative-decoding
          if git diff --cached --quiet; then
            echo 'No generated artifact changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build and publish reviewed SpecDec academic paper assets'
          git push origin "HEAD:refs/heads/research/specdec-academic-survey-20261118"
