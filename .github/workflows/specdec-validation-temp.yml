name: SpecDec Branch Verification (temporary)

on:
  push:
    branches:
      - feat/specdec-living-synthesis-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    name: Python + Vitest + TypeScript + Vite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Python topic validations
        run: python3 -m unittest discover -s scripts
      - name: npm ci
        run: npm ci
      - name: Vitest
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Install isolated browser smoke dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          command -v google-chrome || command -v google-chrome-stable || { echo "::error::Chrome not preinstalled"; exit 1; }
      - name: Exercise all topic views in Chromium
        run: |
          (npm run preview -- --host 127.0.0.1 --port 5173 > /tmp/specdec-preview.log 2>&1 & echo $! > /tmp/specdec-preview.pid)
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node .github/specdec-browser-smoke.mjs
      - name: Upload browser snapshots (temporary)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: specdec-browser-snapshots
          path: /tmp/specdec-browser
          if-no-files-found: ignore
          retention-days: 1
