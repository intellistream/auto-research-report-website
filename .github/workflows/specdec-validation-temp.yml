name: SpecDec Branch Verification (temporary)

on:
  push:
    branches:
      - feat/specdec-living-synthesis-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-test:
    name: Python + Vitest + TypeScript + Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Python topic validations
        run: python3 -m unittest discover -s scripts
      - name: npm ci
        run: npm ci
      - name: Vitest
        run: npm test
      - name: TypeScript and production build
        run: npm run build
